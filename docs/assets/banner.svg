<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Mica banner">
  <defs>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.55" stop-color="#7ee2b8"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#30363d" stroke-width="1" opacity="0.35"/>
    </pattern>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="#0d1117"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect y="0" width="1200" height="120" fill="url(#scan)"/>

  <!-- circuit traces -->
  <g fill="none" stroke="#1f6feb" stroke-width="1.5" opacity="0.55">
    <path d="M40 250 H160 V210 H230"/>
    <path d="M1160 60 H1040 V95 H960"/>
    <path d="M60 40 H180 V70 H260"/>
    <path d="M1140 240 H1020 V205 H940"/>
  </g>
  <g fill="#58a6ff">
    <circle cx="230" cy="210" r="4"/>
    <circle cx="960" cy="95" r="4" fill="#3fb950"/>
    <circle cx="260" cy="70" r="4" fill="#bc8cff"/>
    <circle cx="940" cy="205" r="4"/>
  </g>
  <g>
    <circle cx="230" cy="210" r="8" fill="none" stroke="#58a6ff" opacity="0.6">
      <animate attributeName="r" values="6;12;6" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="960" cy="95" r="8" fill="none" stroke="#3fb950" opacity="0.6">
      <animate attributeName="r" values="6;12;6" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="205" r="8" fill="none" stroke="#f778ba" opacity="0.6">
      <animate attributeName="r" values="6;12;6" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2.8s" begin="1.7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- wordmark -->
  <text x="600" y="118" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="17" letter-spacing="6" fill="#8b949e">// DESKTOP AI AGENT</text>
  <text x="600" y="185" text-anchor="middle" font-family="ui-monospace,'Cascadia Code',Consolas,monospace" font-size="76" font-weight="700" letter-spacing="14" fill="url(#titleGrad)" filter="url(#glow)">MICA</text>
  <text x="600" y="226" text-anchor="middle" font-family="'Segoe UI','Microsoft YaHei',sans-serif" font-size="18" fill="#8b949e">以浏览器为推理内核 · Tauri v2 · Rust 引擎 · 0 Token 成本</text>

  <!-- bottom rule + version -->
  <rect x="440" y="252" width="320" height="1" fill="#30363d"/>
  <text x="600" y="276" text-anchor="middle" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="3" fill="#6e7681">v0.1.1 · WEBVIEW2 · CDP · FAIL-CLOSED</text>
</svg>
